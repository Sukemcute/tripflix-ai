  - {from: TP.HCM, to: Cần Thơ, from_station: Bến xe Miền Tây, to_station: Bến xe Trung tâm Cần Thơ, kind: xe khách, xe limousine}
  - {from: Hà Nội, to: Sa Pa, from_station: Bến xe Mỹ Đình, to_station: Bến xe Sa Pa, kind: xe giường nằm}
  - {from: Hà Nội, to: Hạ Long, from_station: Bến xe Mỹ Đình, to_station: Bến xe Bãi Cháy, kind: xe khách, xe limousine}
