# Intercity bus routes for Tripi (plan B4, Bảo 16/11: sample routes, labelled "for reference").
#
# Only the route, the two bus stations and the kind of coach. No prices, departure times or
# operator names: there is no public operator API in Vietnam and AI travel answers get exactly
# these wrong most often (DeepResearch trợ lý đầy đủ §3.4). Travel time is not stored here: code
# estimates it from the two cities (route.py), so nothing below can go stale.
# Reference data like packing.v2.yaml, not a business entity; move to Core when a real source
# exists.
attribution: Tham khảo, chưa đặt được trên Tripflix
routes:
  - {from: TP.HCM, to: Vũng Tàu, from_station: Bến xe Miền Đông, to_station: Bến xe Vũng Tàu, kind: xe khách, xe limousine}
  - {from: TP.HCM, to: Đà Lạt, from_station: Bến xe Miền Đông mới, to_station: Bến xe Liên tỉnh Đà Lạt, kind: xe giường nằm}
  - {from: TP.HCM, to: Nha Trang, from_station: Bến xe Miền Đông mới, to_station: Bến xe Phía Nam Nha Trang, kind: xe giường nằm}
