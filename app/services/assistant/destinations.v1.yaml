# Domestic destinations Tripi may suggest when the user has no place in mind (consult intent).
#
# Reference data like transport.v1.yaml and packing.v2.yaml, not a business entity. Source:
# general knowledge only, no live data. Only what changes slowly: where it is, what kind of
# place it is, the months that are usually pleasant, and a few well-known features. No prices,
# opening hours or dated events (a digit in a highlight is rejected by the loader). Names are
# written the way Core and transport.v1.yaml write them, so a suggestion can be searched as is.
# Content is a draft: chờ Bảo duyệt nội dung (months and vibes are rules of thumb, not forecasts).
# Fields: region = bac | trung | nam | tay-nguyen; terrain and vibe use the values of
# TravelPrefs (schemas.py); good_months = months usually good for the trip, 1-12.
attribution: Tham khảo, kiến thức chung
