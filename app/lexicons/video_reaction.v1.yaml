# Rule L12: comments that only react to the video, not to the real place.
# Seed patterns from QT Bước 5 (L12); the LLM still flags harder cases via `excluded`.
# v1: drafted by Claude from QT, pending review by Bảo, 2026-11-04.
name: video_reaction
version: 1
groups:
  speculation:
    patterns:
      - 'nhin co ve'
      - 'chac la'
      - 'nghe don'
    match:
      - 'nhin co ve sau lam'
    no_match:
      - 'nuoc sau lam nha'
  wish:
    patterns:
      - 'uoc (gi )?(duoc )?di'
      - 'mong (mot|1) lan'
      - 'them di'
    match:
      - 'uoc duoc di 1 lan'
      - 'them di qua'
    no_match:
      - 'minh di roi dep lam'
  video_praise:
    patterns:
      - 'nhac hay'
      - 'edit (dinh|xin|cuon)'
      - 'flycam muot'
      - 'clip cuon'
      - 'quay dep'
    match:
      - 'nhac hay qua ad oi'
      - 'flycam muot ghe'
    no_match:
      - 'phong dep view bien'
