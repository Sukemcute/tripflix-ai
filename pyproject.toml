[project]
name = "tripflix-ai"
version = "0.1.0"
description = "AI service for Tripflix"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic>=1,<2",
    "fastapi[standard]>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "onnxruntime>=1.20,<2.0",
    "pydantic-settings>=2.6,<3.0",
    "pyjwt[crypto]>=2.8,<3.0",
    "pyyaml>=6.0,<7.0",
    "redis>=5.0,<7.0",
    "tokenizers>=0.21,<1.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.390,<2.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["app", "tests"]
