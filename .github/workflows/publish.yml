name: publish

on:
  push:
    branches: [develop, main]
    tags: ["v*", "ai-v*"]

permissions:
  contents: read
  packages: write

jobs:
  # CI đỏ thì không build image, để server không kéo phải bản lỗi.
  check:
    uses: ./.github/workflows/ci.yml

  image:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # Model phân loại bình luận (~99 MB) không nằm trong git: tải từ GitHub Release vào
      # app/models/comment_classifier, script tự kiểm sha256; image prod COPY app nên model vào theo.
      # Tải lỗi thì build fail: không có model worker vẫn chạy nhưng lặng lẽ tụt về luật.
      # Đổi model: tạo release tag mới rồi sửa CLASSIFIER_TAG.
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - run: uv sync --locked --no-dev
      - name: Tải model phân loại bình luận
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLASSIFIER_TAG: comment-classifier-v1
        run: uv run --no-sync python -m scripts.fetch_classifier --tag "$CLASSIFIER_TAG"
      # Builder buildx cần cho cache type=gha (driver docker mặc định không ghi được cache này).
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}/ai-service
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: prod
          push: true
          # Không đẩy attestation: mỗi lần build chỉ còn một phiên bản trong GHCR thay vì ba.
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ai-service
          cache-to: type=gha,scope=ai-service,mode=max
